name: PR Quality Gate
permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      # Pinned for supply-chain safety. Update deliberately, not automatically.
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0
        with:
          # Permissive defaults for a public template (upstream default is 4).
          max-failures: 6
          # Observe-only mode. Upstream defaults to close-pr: true, which can close
          # legitimate first-time contributors' PRs. Raise strictness once tuned.
          # Note: upstream has no `dry-run` input, so this flag is the closest equivalent.
          close-pr: false
          failure-add-pr-labels: "needs-review"
          failure-pr-message: "This PR tripped the automated quality checks. A maintainer will review it manually."

